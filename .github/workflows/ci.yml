name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_model_integration:
        description: Download model weights and run CPU reference integration tests
        required: true
        type: boolean
        default: false

jobs:
  quality-and-wheel:
    name: Quality and wheel validation (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --group dev

      - name: Run unit tests without model weights
        run: uv run --locked pytest -m "not integration"

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Verify base install does not require PyAV
        run: uv run --locked python -c "import sys, openvlclip, openvlclip.batching, openvlclip.image_search; assert 'av' not in sys.modules"

      - name: Build sdist and wheel
        run: uv build

      - name: Verify wheel contents
        shell: pwsh
        run: |
          $expectedVersion = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv run --locked python tools/verify_wheel.py $wheel --expected-version $expectedVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdist = (Get-ChildItem dist/*.tar.gz | Select-Object -First 1).FullName
          uv run --locked python tools/verify_sdist.py $sdist --expected-version $expectedVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install wheel into a clean virtual environment and import it
        shell: pwsh
        run: |
          $expectedVersion = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          uv venv --python ${{ matrix.python-version }} .venv-wheel-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheelPython = if ($IsWindows) { ".venv-wheel-check/Scripts/python.exe" } else { ".venv-wheel-check/bin/python" }
          $wheelPython = (Resolve-Path $wheelPython).Path
          $wheelUri = [System.Uri]::new($wheel).AbsoluteUri
          $wheelRequirement = "openvlclip[dinotxt,video] @ $wheelUri"
          uv pip install --python $wheelPython $wheelRequirement
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wheelPython -c "import av, ftfy, importlib.metadata as m, openvlclip, regex; assert m.version('openvlclip') == '$expectedVersion'; assert set(openvlclip.__all__) == {'EmbeddingGemmaCLIP', 'create_model', 'create_model_and_transforms', 'create_model_from_pretrained', 'get_tokenizer', 'list_models', 'list_pretrained'}; assert 'site-packages' in openvlclip.__file__; print(openvlclip.__file__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  video-dependencies:
    name: Video and DINO extras tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install video and DINO extras with development dependencies
        run: uv sync --locked --group dev --extra video --extra dinotxt

      - name: Run unit tests with both optional extras installed
        run: uv run --locked pytest -m "not integration"

  model-integration:
    name: CPU model integration (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_model_integration
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install integration dependencies
        run: uv sync --locked --group dev --extra integration --extra video --extra dinotxt

      - name: Run pinned-model integration tests
        shell: pwsh
        run: |
          $env:OPENCLIP_GEMMA_RUN_INTEGRATION = "1"
          uv run --locked pytest -m integration
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
