name: Publish v0.4.0rc1 to TestPyPI

on:
  push:
    tags:
      - v0.4.0rc1

permissions: {}

concurrency:
  group: testpypi-v0.4.0rc1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Verify release source and build distributions
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    env:
      EXPECTED_TAG: v0.4.0rc1
      EXPECTED_VERSION: 0.4.0rc1
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Require the exact release tag and a CI-passing main commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_EVENT_NAME -cne "push") {
            throw "This workflow only publishes from the exact v0.4.0rc1 tag push."
          }

          $expectedRef = "refs/tags/$env:EXPECTED_TAG"
          if ($env:GITHUB_REF -cne $expectedRef) {
            throw "Only $expectedRef may publish to TestPyPI."
          }

          $tagCommit = (git rev-parse "$expectedRef^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:GITHUB_SHA) {
            throw "The release tag must resolve to the workflow commit."
          }

          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch main to verify release ancestry."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "The release commit must be reachable from main."
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $runsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&status=completed&per_page=100"
          $runs = Invoke-RestMethod -Method Get -Uri $runsUri -Headers $headers
          $successfulRun = @(
            $runs.workflow_runs |
              Where-Object {
                $_.head_sha -ceq $env:GITHUB_SHA -and $_.conclusion -ceq "success"
              } |
              Select-Object -First 1
          )
          if ($successfulRun.Count -eq 0) {
            throw "CI must have a successful run for this exact commit before publication."
          }
          Write-Host "Verified successful CI run $($successfulRun[0].id) for $env:GITHUB_SHA."

          $projectVersion = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or $projectVersion -cne $env:EXPECTED_VERSION) {
            throw "pyproject.toml must declare version $env:EXPECTED_VERSION."
          }

          "Release tag: $expectedRef" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Successful CI run: $($successfulRun[0].id)" >> $env:GITHUB_STEP_SUMMARY

      - name: Verify the dependency lock
        run: uv lock --check

      - name: Install locked build and test dependencies
        run: uv sync --locked --group dev --extra video

      - name: Run release unit tests and lint
        shell: pwsh
        run: |
          uv run --locked pytest -m "not integration"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and inspect release distributions
        shell: pwsh
        run: |
          $env:SOURCE_DATE_EPOCH = (git show -s --format=%ct $env:GITHUB_SHA).Trim()
          $constraints = Join-Path $env:RUNNER_TEMP "v0.4.0rc1-build-constraints.txt"
          "uv_build==0.13.1" | Set-Content -Path $constraints -Encoding ascii
          uv build --build-constraints $constraints --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $wheel = Get-ChildItem dist\*.whl
          $sdist = Get-ChildItem dist\*.tar.gz
          if ($wheel.Count -ne 1 -or $sdist.Count -ne 1) {
            throw "Expected exactly one wheel and one sdist."
          }
          uv run --locked python tools\verify_wheel.py $wheel[0].FullName --expected-version $env:EXPECTED_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python tools\verify_sdist.py $sdist[0].FullName --expected-version $env:EXPECTED_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload verified distributions for the publish job
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: testpypi-0.4.0rc1-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to TestPyPI with Trusted Publishing
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/openclip-gemma/0.4.0rc1/
    permissions:
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: testpypi-0.4.0rc1-distributions
          path: dist

      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
