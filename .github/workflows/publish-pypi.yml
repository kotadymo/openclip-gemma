name: Publish openvlclip to PyPI

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Verify release source and build distributions
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.verify-release.outputs.version }}
    env:
      DINOTXT_LICENSE_CONFIRMED: ${{ vars.OPENVLCLIP_DINOTXT_LICENSE_CONFIRMED }}
      V070_MODELS_LICENSE_CONFIRMED: ${{ vars.OPENVLCLIP_V070_MODELS_LICENSE_CONFIRMED }}
    steps:
      - name: Check out the exact tagged commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.10"

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Validate release identity, provenance, license gates, and package metadata
        id: verify-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:GITHUB_EVENT_NAME -cne "push" -or $env:GITHUB_REF_TYPE -cne "tag") {
            throw "Publishing is allowed only for a pushed Git tag."
          }
          if ($env:GITHUB_REPOSITORY -cne "kotadymo/openvlclip") {
            throw "This workflow is restricted to kotadymo/openvlclip."
          }

          $tag = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF -cne "refs/tags/$tag") {
            throw "The workflow ref must be the exact pushed tag."
          }
          if ($tag -cnotmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "Release tags must use stable vMAJOR.MINOR.PATCH SemVer."
          }
          $version = "$($Matches[1]).$($Matches[2]).$($Matches[3])"
          if ([version]$version -lt [version]"0.7.0") {
            throw "The shared workflow only publishes versions from 0.7.0 onward."
          }

          $tagCommit = (& git rev-parse "refs/tags/$tag^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -cne $env:GITHUB_SHA) {
            throw "The release tag must resolve to the workflow commit."
          }
          git fetch --no-tags origin main
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch main to verify release ancestry."
          }
          git merge-base --is-ancestor $env:GITHUB_SHA FETCH_HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "The release commit must be reachable from main."
          }

          $headers = @{
            Accept = "application/vnd.github+json"
            Authorization = "Bearer $env:GH_TOKEN"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $runsUri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&status=completed&per_page=100"
          $runs = Invoke-RestMethod -Method Get -Uri $runsUri -Headers $headers
          $successfulRun = @(
            $runs.workflow_runs |
              Where-Object {
                $_.head_sha -ceq $env:GITHUB_SHA -and
                $_.event -ceq "push" -and
                $_.head_branch -ceq "main" -and
                $_.conclusion -ceq "success"
              } |
              Select-Object -First 1
          )
          if ($successfulRun.Count -eq 0) {
            throw "A successful main push CI run for this exact SHA is required."
          }

          if ($env:DINOTXT_LICENSE_CONFIRMED -cne "true") {
            throw "Publishing is blocked until OPENVLCLIP_DINOTXT_LICENSE_CONFIRMED is true."
          }
          if ($env:V070_MODELS_LICENSE_CONFIRMED -cne "true") {
            throw "Publishing is blocked until OPENVLCLIP_V070_MODELS_LICENSE_CONFIRMED is true."
          }

          $pypiUri = "https://pypi.org/pypi/openvlclip/$version/json"
          try {
            $pypiResponse = Invoke-WebRequest -Uri $pypiUri -Method Get -TimeoutSec 20 -SkipHttpErrorCheck
          } catch {
            throw "Could not verify that $version is absent from PyPI; refusing to publish."
          }
          if ($pypiResponse.StatusCode -eq 200) {
            throw "openvlclip $version is already published on PyPI."
          }
          if ($pypiResponse.StatusCode -ne 404) {
            throw "PyPI returned HTTP $($pypiResponse.StatusCode); refusing to publish."
          }

          $projectName = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])").Trim()
          if ($LASTEXITCODE -ne 0 -or $projectName -cne "openvlclip") {
            throw "pyproject.toml must declare the openvlclip distribution."
          }
          $projectVersion = (& python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])").Trim()
          if ($LASTEXITCODE -ne 0 -or $projectVersion -cne $version) {
            throw "pyproject.toml version must match tag $tag."
          }
          $lockVersion = (& python -c "import tomllib; d=tomllib.load(open('uv.lock', 'rb')); p=next((p for p in d['package'] if p['name']=='openvlclip' and p.get('source', {}).get('editable')=='.'), None); print(p['version'] if p else '')").Trim()
          if ($LASTEXITCODE -ne 0 -or $lockVersion -cne $version) {
            throw "uv.lock must contain the matching editable openvlclip version."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "Release tag: $tag" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Successful main CI run: $($successfulRun[0].id)" >> $env:GITHUB_STEP_SUMMARY
          "PyPI version absence and both license gates were verified." >> $env:GITHUB_STEP_SUMMARY

      - name: Verify dependency lock
        run: uv lock --check

      - name: Install locked build and test dependencies
        run: uv sync --locked --group dev

      - name: Run release tests and lint
        shell: pwsh
        run: |
          uv run --locked pytest -m "not integration"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and inspect release distributions
        id: distributions
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.verify-release.outputs.version }}
        run: |
          $env:SOURCE_DATE_EPOCH = (git show -s --format=%ct $env:GITHUB_SHA).Trim()
          $constraints = Join-Path $env:RUNNER_TEMP "openvlclip-$env:RELEASE_VERSION-build-constraints.txt"
          "uv_build==0.13.1" | Set-Content -Path $constraints -Encoding ascii
          uv build --build-constraints $constraints --out-dir dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $wheel = @(Get-ChildItem dist\*.whl)
          $sdist = @(Get-ChildItem dist\*.tar.gz)
          if ($wheel.Count -ne 1 -or $sdist.Count -ne 1) {
            throw "Expected exactly one wheel and one sdist."
          }
          uv run --locked python tools\verify_wheel.py $wheel[0].FullName --expected-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked python tools\verify_sdist.py $sdist[0].FullName --expected-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Get-FileHash $wheel[0].FullName -Algorithm SHA256 | ForEach-Object {
            "Wheel SHA-256: $($_.Hash)" >> $env:GITHUB_STEP_SUMMARY
          }
          Get-FileHash $sdist[0].FullName -Algorithm SHA256 | ForEach-Object {
            "sdist SHA-256: $($_.Hash)" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload verified distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pypi-openvlclip-${{ steps.verify-release.outputs.version }}-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to production PyPI with Trusted Publishing
    needs: build-and-verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openvlclip/
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pypi-openvlclip-${{ needs.build-and-verify.outputs.version }}-distributions
          path: dist

      - name: Publish to production PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
