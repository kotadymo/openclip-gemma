[project]
name = "openclip-gemma"
version = "0.1.0"
description = "OpenCLIP-compatible inference API for EmbeddingGemma 2"
readme = "README.md"
authors = [
    { name = "KotaN", email = "ai_keiba_unyou@googlegroups.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=13.0.0",
    "torch>=2.14.1",
    "transformers>=5.18.0.dev0",
    "torchvision>=0.29.1",
]

[project.scripts]
openclip-gemma = "openclip_gemma:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]
m0 = [
    "pillow>=13.0.0",
    "sentence-transformers[image]>=6.1.0",
    "torch>=2.14.1",
    "transformers>=5.18.0.dev0",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires the pinned model weights and additional resources",
]
