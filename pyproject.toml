[project]
name = "openclip-gemma"
version = "0.2.0rc1"
description = "OpenCLIP-style image and text inference with EmbeddingGemma 2"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "kotadymo" }
]
requires-python = ">=3.12,<3.15,!=3.14.1"
keywords = [
    "embeddinggemma",
    "openclip",
    "image-embeddings",
    "text-embeddings",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=13.0.0,<14",
    "torch>=2.14.1,<3",
    "transformers>=5.20.1,<6",
    "torchvision>=0.29.1,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
    "ruff>=0.17.1,<0.18",
]
integration = [
    "sentence-transformers[image]>=6.1.0,<7",
]
video = [
    "av>=19.0.1,<20",
]
benchmark = [
    "psutil>=7.1.0,<8",
]

[project.urls]
Homepage = "https://github.com/kotadymo/openclip-gemma"
Repository = "https://github.com/kotadymo/openclip-gemma"
Issues = "https://github.com/kotadymo/openclip-gemma/issues"
"Compatibility Report" = "https://github.com/kotadymo/openclip-gemma/blob/main/docs/openclip-compatibility-report.md"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1,<0.18",
]
m0 = [
    "sentence-transformers[image]>=6.1.0,<7",
]

[tool.pytest.ini_options]
markers = [
    "integration: requires the pinned model weights and additional resources",
]
